name: Build Qz Override Package

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  package:
    name: Build package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            MMUI-V2X/package-lock.json
            LoginUI/package-lock.json

      - name: Build packager
        shell: pwsh
        run: |
          go build -o scripts/mmui-packager.exe scripts/package.go

      - name: Build qz override package
        shell: pwsh
        run: |
          .\scripts\mmui-packager.exe -name mmui-v2x-qz-override.zip

      - name: Generate checksum
        shell: pwsh
        run: |
          $zip = "release\mmui-v2x-qz-override.zip"
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$sha  mmui-v2x-qz-override.zip" | Set-Content -Encoding ascii "release\mmui-v2x-qz-override.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmui-v2x-qz-override
          path: |
            release/mmui-v2x-qz-override.zip
            release/mmui-v2x-qz-override.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mmui-v2x-qz-override.zip
            release/mmui-v2x-qz-override.zip.sha256
