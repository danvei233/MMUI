name: Build Qz Override Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example V2X 2.0.1 (defaults to manifest version)"
        required: false
        type: string
  release:
    types:
      - published
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  package:
    name: Build package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            MMUI-V2X/package-lock.json
            LoginUI/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: |
            MMUI-V2X/node_modules
            LoginUI/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('MMUI-V2X/package-lock.json', 'LoginUI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Resolve package version
        id: package
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = ([string]$env:MANUAL_VERSION).Trim()
          if (-not $version -and $env:EVENT_NAME -eq "release") {
            $version = ([string]$env:RELEASE_TAG).Trim()
          }
          if (-not $version -and $env:GITHUB_REF -like "refs/tags/*") {
            $version = ([string]$env:REF_NAME).Trim()
          }
          if (-not $version) {
            $manifest = Get-Content "qz-override/mmui-manifest.json" -Raw | ConvertFrom-Json
            $version = [string]$manifest.version
          }

          $slug = ($version -replace '^refs/tags/', '' -replace '[^0-9A-Za-z._+-]+', '-').Trim('-')
          if (-not $slug) {
            throw "Unable to derive package filename from version: $version"
          }
          $filename = "mmui-v2x-qz-override-$slug.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "artifact=mmui-v2x-qz-override-$slug" >> $env:GITHUB_OUTPUT
          "Resolved package version: $version"

      - name: Build packager
        shell: pwsh
        run: |
          go build -o scripts/mmui-packager.exe scripts/package.go

      - name: Build qz override package
        shell: pwsh
        run: |
          .\scripts\mmui-packager.exe -source-build -version "${{ steps.package.outputs.version }}" -name "${{ steps.package.outputs.filename }}"

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "${{ steps.package.outputs.filename }}"
          $zip = "release\$filename"
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$sha  $filename" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            release/${{ steps.package.outputs.filename }}
            release/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ steps.package.outputs.filename }}
            release/${{ steps.package.outputs.filename }}.sha256
